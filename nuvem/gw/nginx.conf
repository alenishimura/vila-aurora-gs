worker_processes 1;
events { worker_connections 256; }

http {
    server_tokens off;

    log_format json escape=json '{"ts":"$time_iso8601","servico":"nuvem-gw","evento":"http",'
        '"cliente_ip":"$remote_addr","cn":"$cliente_cn","verificacao_cert":"$ssl_client_verify",'
        '"metodo":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"tempo":$request_time,"ua":"$http_user_agent"}';
    access_log /logs/gw-acesso.log json;
    error_log /logs/gw-erro.log notice;

    map $ssl_client_s_dn $cliente_cn {
        ~CN=(?<cn>[^,/]+) $cn;
        default "";
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;

    # ingest das bordas: mTLS obrigatorio + CRL
    server {
        listen 10.10.0.1:443 ssl;
        ssl_certificate     /pki/cert.pem;
        ssl_certificate_key /pki/key.pem;
        ssl_client_certificate /pki/ca.crt;
        ssl_crl /pki-pub/crl.pem;
        ssl_verify_client on;
        client_max_body_size 2m;

        location / {
            proxy_pass http://coletor:5001;
            proxy_set_header X-Cliente-CN $cliente_cn;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # operador remoto chega no painel so por dentro da VPN
    server {
        listen 10.10.0.1:8443 ssl;
        ssl_certificate     /pki/cert.pem;
        ssl_certificate_key /pki/key.pem;

        location / {
            proxy_pass https://waf:8443;
            proxy_ssl_trusted_certificate /pki/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_name waf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
