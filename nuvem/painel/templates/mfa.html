{% extends "base.html" %}
{% block titulo %}Código de verificação{% endblock %}
{% block conteudo %}
<h1>Código de verificação</h1>
<p>Abra o aplicativo autenticador no seu celular e digite o código de 6 números.</p>
{% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="cartao estreito">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="codigo">Código</label>
  <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
