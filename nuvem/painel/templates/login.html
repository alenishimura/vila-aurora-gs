{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar no painel</h1>
{% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="cartao estreito">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="usuario">Usuário</label>
  <input id="usuario" name="usuario" autocomplete="username" required maxlength="40">
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password" required>
  <button type="submit">Continuar</button>
</form>
<p class="dica">A prefeitura nunca pede sua senha por e-mail ou WhatsApp. Na dúvida, ligue para a coordenação no número do cartaz.</p>
{% endblock %}
